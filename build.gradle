plugins {
    id "com.google.protobuf" version "0.10.0" // for GRPC
    id "java"
    id "war" // for REST
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    jerseyVersion = '3.1.12'
    jacksonVersion = '2.17.2'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'

    // GRPC Dependencies
    // https://mvnrepository.com/artifact/com.google.protobuf/protobuf-java
    implementation 'com.google.protobuf:protobuf-java:3.13.0'

    // https://mvnrepository.com/artifact/io.grpc/grpc-all
    implementation 'io.grpc:grpc-all:1.25.0'

    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    implementation 'com.google.code.gson:gson:2.7'

    // REST Dependencies
    // https://mvnrepository.com/artifact/org.codehaus.jackson/jackson-core-asl
    implementation 'org.codehaus.jackson:jackson-core-asl:1.9.2'
    // https://mvnrepository.com/artifact/org.codehaus.jackson/jackson-jaxrs
    implementation 'org.codehaus.jackson:jackson-jaxrs:1.9.2'
    // https://mvnrepository.com/artifact/org.codehaus.jackson/jackson-mapper-asl
    implementation 'org.codehaus.jackson:jackson-mapper-asl:1.9.2'
    // https://mvnrepository.com/artifact/org.codehaus.jackson/jackson-xc
    implementation 'org.codehaus.jackson:jackson-xc:1.9.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    implementation "org.glassfish.jersey.core:jersey-client:${jerseyVersion}"
    implementation "org.glassfish.jersey.core:jersey-server:${jerseyVersion}"

    implementation "org.glassfish.jersey.media:jersey-media-json-jackson:${jerseyVersion}"
    implementation "org.glassfish.jersey.inject:jersey-hk2:${jerseyVersion}"

    /*// Use this if you run Jersey in a servlet container / WAR
    implementation "org.glassfish.jersey.containers:jersey-container-servlet-core:${jerseyVersion}"

    // Use this if you run Jersey as an embedded HTTP server from main()
    implementation "org.glassfish.jersey.containers:jersey-container-grizzly2-http:${jerseyVersion}"
    */

    // https://mvnrepository.com/artifact/com.sun.jersey/jersey-client
    implementation 'com.sun.jersey:jersey-client:1.19.1'
    // https://mvnrepository.com/artifact/com.sun.jersey/jersey-core
    implementation 'com.sun.jersey:jersey-core:1.19.1'
    // https://mvnrepository.com/artifact/com.sun.jersey/jersey-json
    implementation 'com.sun.jersey:jersey-json:1.19.1'
    // https://mvnrepository.com/artifact/com.sun.jersey/jersey-server
    implementation 'com.sun.jersey:jersey-server:1.19.1'
    // https://mvnrepository.com/artifact/com.sun.jersey/jersey-servlet
    implementation 'com.sun.jersey:jersey-servlet:1.19.1'
    // https://mvnrepository.com/artifact/com.sun.jersey/jersey-server
    implementation 'com.sun.jersey:jersey-server:1.2'
    // https://mvnrepository.com/artifact/org.codehaus.jettison/jettison
    implementation 'org.codehaus.jettison:jettison:1.1'
    // https://mvnrepository.com/artifact/javax.ws.rs/jsr311-api
    implementation 'javax.ws.rs:jsr311-api:1.1.1'
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'




    // MQTT Dependencies
    // https://mvnrepository.com/artifact/org.eclipse.paho/org.eclipse.paho.client.mqttv3
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}


// GRPC
sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.0.0'
    }

    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.0.0-pre2'
        }
    }

    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}


test {
    useJUnitPlatform()
}